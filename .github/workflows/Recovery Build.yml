name: TWRP Build for Infinix X6725B

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device codename'
        required: true
        default: 'X6725B'
      branch:
        description: 'TWRP branch'
        required: true
        default: 'twrp-12.1'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    # ========== Environment Setup ==========
    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential curl git python3 repo
        
    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH
        
    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Check GitHub Token
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "⚠️ Warning: GH_TOKEN secret is not set!"
        else
          echo "✅ Token found"
          git config --global credential.helper store
          echo "https://x-access-token:${GH_TOKEN}@github.com" > ~/.git-credentials
        fi

    # ========== 🔴 FIX: DIRECTORY CREATION ==========
    - name: Create Working Directory and Clone TWRP Manifest
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        # ডিরেক্টরি তৈরি এবং ভেরিফাই
        mkdir -p /home/runner/twrp
        cd /home/runner/twrp
        echo "✅ Working directory: $(pwd)"
        echo "Directory contents:"
        ls -la
        
        # Manifest ক্লোন
        if [ -n "$GH_TOKEN" ]; then
          echo "📥 Using repo init with token..."
          repo init --depth=1 -u https://x-access-token:${GH_TOKEN}@github.com/minimal-twrp/manifest.git -b ${{ github.event.inputs.branch }}
        else
          echo "📥 Direct clone without token..."
          mkdir -p .repo
          git clone --depth 1 https://github.com/minimal-twrp/manifest.git .repo/manifests
          cd .repo/manifests
          git checkout ${{ github.event.inputs.branch }} || git checkout twrp-12.1
          cd ../..
          ln -sf .repo/manifests/default.xml .repo/manifest.xml
        fi
        
        echo "✅ Manifest initialized in $(pwd)"

    - name: Sync TWRP Source
      run: |
        cd /home/runner/twrp
        echo "Syncing in $(pwd)..."
        
        repo sync -c -j2 --force-sync --no-clone-bundle --no-tags || \
        echo "⚠️ Sync had some issues but continuing..."

    # ========== Clone Device Tree ==========
    - name: Clone Device Tree
      run: |
        cd /home/runner/twrp
        echo "Cloning device tree in $(pwd)..."
        
        # Device tree ক্লোন
        mkdir -p device/infinix/X6725B
        git clone --depth 1 https://github.com/Shahed420/Infinix_X6725B_TWRP_Tree.git device_tree_temp
        cp -r device_tree_temp/* device/infinix/X6725B/
        rm -rf device_tree_temp
        
        echo "✅ Device tree cloned"

    # ========== Create Dummy Kernel ==========
    - name: Create Dummy Kernel
      run: |
        cd /home/runner/twrp
        mkdir -p device/infinix/X6725B/prebuilt
        echo "dummy kernel" > device/infinix/X6725B/prebuilt/kernel
        touch device/infinix/X6725B/prebuilt/dtb.img
        echo "✅ Dummy kernel created"

    # ========== Build TWRP ==========
    - name: Build TWRP
      run: |
        cd /home/runner/twrp
        
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        
        if [ -f "build/envsetup.sh" ]; then
          source build/envsetup.sh
          lunch twrp_X6725B-eng || echo "Lunch failed but continuing"
          echo "🔨 Building..."
          mka recoveryimage -j2
        else
          echo "build/envsetup.sh not found!"
          ls -la
        fi

    # ========== Upload Artifacts ==========
    - name: Upload Recovery Image
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-X6725B
        path: |
          /home/runner/twrp/out/target/product/X6725B/recovery.img
          /home/runner/twrp/out/target/product/X6725B/boot.img
        if-no-files-found: ignore    # ========== Create Dummy Kernel ==========
    - name: Create Dummy Kernel
      run: |
        cd /home/runner/twrp || { echo "❌ Cannot cd to /home/runner/twrp"; exit 1; }
        
        mkdir -p device/infinix/X6725B/prebuilt
        echo "dummy kernel for build" > device/infinix/X6725B/prebuilt/kernel
        touch device/infinix/X6725B/prebuilt/dtb.img
        echo "✅ Dummy kernel created at device/infinix/X6725B/prebuilt/kernel"

    # ========== Setup Build Environment ==========
    - name: Setup Build Environment
      run: |
        cd /home/runner/twrp || { echo "❌ Cannot cd to /home/runner/twrp"; exit 1; }
        
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        export TARGET_DEVICE=X6725B
        
        export USE_CCACHE=1
        export CCACHE_DIR=/tmp/ccache
        ccache -M 20G || true
        
        echo "✅ Build environment ready in $(pwd)"

    # ========== Build TWRP ==========
    - name: Build TWRP for X6725B
      run: |
        cd /home/runner/twrp || { echo "❌ Cannot cd to /home/runner/twrp"; exit 1; }
        
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        
        if [ -f "build/envsetup.sh" ]; then
          source build/envsetup.sh
          
          echo "🏗️ Trying lunch for X6725B..."
          lunch twrp_X6725B-eng || lunch omni_X6725B-eng
          
          echo "🔨 Building vendor_boot image..."
          mka vendorbootimage -j$(nproc) 2>&1 | tee build.log
          
          echo "🔨 Building recovery image..."
          mka recoveryimage -j$(nproc) 2>&1 | tee -a build.log
        else
          echo "❌ build/envsetup.sh not found!"
          ls -la build/ || echo "build directory empty"
          exit 1
        fi

    # ========== Find Built Images ==========
    - name: Find Built Images
      if: always()
      run: |
        cd /home/runner/twrp || { echo "❌ Cannot cd to /home/runner/twrp"; exit 1; }
        
        echo "📂 Searching for built images in $(pwd)..."
        
        # Find all image files
        find out/target/product/X6725B -name "*.img" -type f 2>/dev/null | tee /home/runner/images.txt || echo "No images found"
        
        # Copy images to workspace
        mkdir -p /home/runner/output
        find out/target/product/X6725B -name "*.img" -type f -exec cp {} /home/runner/output/ \; 2>/dev/null || true
        
        ls -la /home/runner/output/ || echo "No images copied"

    # ========== Upload TWRP Images ==========
    - name: Upload TWRP Images
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-X6725B-${{ github.run_number }}
        path: |
          /home/runner/twrp/out/target/product/X6725B/vendor_boot.img
          /home/runner/twrp/out/target/product/X6725B/recovery.img
          /home/runner/twrp/out/target/product/X6725B/boot.img
          /home/runner/twrp/build.log
          /home/runner/images.txt
          /home/runner/output/
        if-no-files-found: warn
        retention-days: 30        echo "Will use direct lunch command instead"

    # ========== Create Dummy Kernel ==========
    - name: Create Dummy Kernel (if needed)
      run: |
        cd ~/twrp
        mkdir -p device/infinix/X6725B/prebuilt
        
        # BoardConfig থেকে kernel পাথ চেক
        if grep -q "TARGET_PREBUILT_KERNEL" device/infinix/X6725B/BoardConfig.mk; then
          echo "⚠️ Creating dummy kernel for build"
          echo "dummy kernel for build" > device/infinix/X6725B/prebuilt/kernel
          touch device/infinix/X6725B/prebuilt/dtb.img
          echo "✅ Dummy kernel created"
        fi

    # ========== Setup Build Environment ==========
    - name: Setup Build Environment
      run: |
        cd ~/twrp
        
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        export TARGET_DEVICE=X6725B
        export BOARD_USES_VENDOR_BOOTIMAGE=true
        
        export USE_CCACHE=1
        export CCACHE_DIR=/tmp/ccache
        ccache -M 20G || true
        
        echo "✅ Build environment ready"

    # ========== Build TWRP (without vendorsetup.sh) ==========
    - name: Build TWRP for X6725B
      run: |
        cd ~/twrp
        
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        
        if [ -f "build/envsetup.sh" ]; then
          source build/envsetup.sh
          
          echo "🏗️ Trying lunch for X6725B (vendorsetup.sh is deleted)..."
          
          # vendorsetup.sh ছাড়া lunch কমান্ড
          lunch twrp_X6725B-eng 2>/dev/null || \
          lunch twrp_X6725B-userdebug 2>/dev/null || \
          lunch omni_X6725B-eng 2>/dev/null || \
          {
            echo "⚠️ Lunch failed, setting manual variables"
            export TARGET_PRODUCT=twrp_X6725B
            export TARGET_BUILD_VARIANT=eng
          }
          
          # Check which lunch worked
          echo "Current TARGET_PRODUCT: $TARGET_PRODUCT"
          echo "Current TARGET_BUILD_VARIANT: $TARGET_BUILD_VARIANT"
          
          # Build vendor_boot image
          echo "🔨 Building vendor_boot image..."
          mka vendorbootimage -j$(nproc) 2>&1 | tee build.log
          
          # Build recovery image
          echo "🔨 Building recovery image..."
          mka recoveryimage -j$(nproc) 2>&1 | tee -a build.log
          
          # Build boot image as fallback
          echo "🔨 Building boot image..."
          mka bootimage -j$(nproc) 2>&1 | tee -a build.log
          
        else
          echo "❌ build/envsetup.sh not found!"
          exit 1
        fi

    # ========== Find Built Images ==========
    - name: Find Built Images
      if: always()
      run: |
        cd ~/twrp
        
        echo "📂 Searching for built images..."
        
        # Find all image files
        find out/target/product/X6725B -name "*.img" -type f 2>/dev/null | tee images.txt
        
        # Count images
        IMG_COUNT=$(cat images.txt 2>/dev/null | wc -l)
        echo "Found $IMG_COUNT image files"
        
        if [ -f "out/target/product/X6725B/vendor_boot.img" ]; then
          echo "✅ vendor_boot.img found"
          ls -lh out/target/product/X6725B/vendor_boot.img
        fi
        
        if [ -f "out/target/product/X6725B/recovery.img" ]; then
          echo "✅ recovery.img found"
          ls -lh out/target/product/X6725B/recovery.img
        fi
        
        if [ -f "out/target/product/X6725B/boot.img" ]; then
          echo "✅ boot.img found"
          ls -lh out/target/product/X6725B/boot.img
        fi

    # ========== Upload TWRP Images ==========
    - name: Upload TWRP Images
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-X6725B-BUILD-${{ github.run_number }}
        path: |
          ~/twrp/out/target/product/X6725B/vendor_boot.img
          ~/twrp/out/target/product/X6725B/recovery.img
          ~/twrp/out/target/product/X6725B/boot.img
          ~/twrp/build.log
          ~/twrp/images.txt
        if-no-files-found: warn
        retention-days: 30

    # ========== Upload if build failed ==========
    - name: Upload Complete Out Folder (if build failed)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: complete-out-folder-X6725B
        path: ~/twrp/out/
        retention-days: 7        echo "Will use direct lunch command instead"

    # ========== Create Dummy Kernel ==========
    - name: Create Dummy Kernel (if needed)
      run: |
        cd ~/twrp
        mkdir -p device/infinix/X6725B/prebuilt
        
        # BoardConfig থেকে kernel পাথ চেক
        if grep -q "TARGET_PREBUILT_KERNEL" device/infinix/X6725B/BoardConfig.mk; then
          echo "⚠️ Creating dummy kernel for build"
          echo "dummy kernel for build" > device/infinix/X6725B/prebuilt/kernel
          touch device/infinix/X6725B/prebuilt/dtb.img
          echo "✅ Dummy kernel created"
        fi

    # ========== Setup Build Environment ==========
    - name: Setup Build Environment
      run: |
        cd ~/twrp
        
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        export TARGET_DEVICE=X6725B
        export BOARD_USES_VENDOR_BOOTIMAGE=true
        
        export USE_CCACHE=1
        export CCACHE_DIR=/tmp/ccache
        ccache -M 20G || true
        
        echo "✅ Build environment ready"

    # ========== Build TWRP (without vendorsetup.sh) ==========
    - name: Build TWRP for X6725B
      run: |
        cd ~/twrp
        
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        
        if [ -f "build/envsetup.sh" ]; then
          source build/envsetup.sh
          
          echo "🏗️ Trying lunch for X6725B (vendorsetup.sh is deleted)..."
          
          # vendorsetup.sh ছাড়া lunch কমান্ড
          lunch twrp_X6725B-eng 2>/dev/null || \
          lunch twrp_X6725B-userdebug 2>/dev/null || \
          lunch omni_X6725B-eng 2>/dev/null || \
          {
            echo "⚠️ Lunch failed, setting manual variables"
            export TARGET_PRODUCT=twrp_X6725B
            export TARGET_BUILD_VARIANT=eng
          }
          
          # Check which lunch worked
          echo "Current TARGET_PRODUCT: $TARGET_PRODUCT"
          echo "Current TARGET_BUILD_VARIANT: $TARGET_BUILD_VARIANT"
          
          # Build vendor_boot image
          echo "🔨 Building vendor_boot image..."
          mka vendorbootimage -j$(nproc) 2>&1 | tee build.log
          
          # Build recovery image
          echo "🔨 Building recovery image..."
          mka recoveryimage -j$(nproc) 2>&1 | tee -a build.log
          
          # Build boot image as fallback
          echo "🔨 Building boot image..."
          mka bootimage -j$(nproc) 2>&1 | tee -a build.log
          
        else
          echo "❌ build/envsetup.sh not found!"
          exit 1
        fi

    # ========== Find Built Images ==========
    - name: Find Built Images
      if: always()
      run: |
        cd ~/twrp
        
        echo "📂 Searching for built images..."
        
        # Find all image files
        find out/target/product/X6725B -name "*.img" -type f 2>/dev/null | tee images.txt
        
        # Count images
        IMG_COUNT=$(cat images.txt 2>/dev/null | wc -l)
        echo "Found $IMG_COUNT image files"
        
        if [ -f "out/target/product/X6725B/vendor_boot.img" ]; then
          echo "✅ vendor_boot.img found"
          ls -lh out/target/product/X6725B/vendor_boot.img
        fi
        
        if [ -f "out/target/product/X6725B/recovery.img" ]; then
          echo "✅ recovery.img found"
          ls -lh out/target/product/X6725B/recovery.img
        fi
        
        if [ -f "out/target/product/X6725B/boot.img" ]; then
          echo "✅ boot.img found"
          ls -lh out/target/product/X6725B/boot.img
        fi

    # ========== Upload TWRP Images ==========
    - name: Upload TWRP Images
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-X6725B-BUILD-${{ github.run_number }}
        path: |
          ~/twrp/out/target/product/X6725B/vendor_boot.img
          ~/twrp/out/target/product/X6725B/recovery.img
          ~/twrp/out/target/product/X6725B/boot.img
          ~/twrp/build.log
          ~/twrp/images.txt
        if-no-files-found: warn
        retention-days: 30

    # ========== Upload if build failed ==========
    - name: Upload Complete Out Folder (if build failed)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: complete-out-folder-X6725B
        path: ~/twrp/out/
